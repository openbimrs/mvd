[package]
name = "openbim-mvd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["openbimrs contributors"]
repository = "https://github.com/openbimrs/mvd"
homepage = "https://openbimrs.github.io/mvd/"
documentation = "https://docs.rs/openbim-mvd"
readme = "README.md"
description = "Pure-Rust buildingSMART mvdXML 1.1 typed model, codec, rules, and validation"
keywords = ["bim", "openbim", "ifc", "mvdxml"]
categories = ["parser-implementations", "data-structures"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
quick-xml = { version = "0.41", features = ["serialize"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"
