[package]
name = "openbim-mvd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Pure-Rust buildingSMART mvdXML 1.1 typed model, codec, rules, and validation"
keywords = ["bim", "openbim", "ifc", "mvdxml"]
categories = ["parser-implementations", "data-structures"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[lints]
workspace = true

[dependencies]
quick-xml = { version = "0.41", features = ["serialize"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"
