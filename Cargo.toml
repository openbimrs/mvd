[workspace]
resolver = "2"
members = ["openbim-mvd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["openbimrs contributors"]
repository = "https://github.com/openbimrs/mvd"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
