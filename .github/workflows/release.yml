# Publish openbim-mvd to crates.io when a release tag `v<version>` is pushed.
#
# crates.io trusted publishing (OIDC): there is no token secret. crates.io
# trusts exactly this repository, this file name (`release.yml`) and the
# `crates.io` environment -- renaming either breaks publishing until the
# crate's Settings -> Trusted Publishing entry on crates.io follows. The
# temporary token lives for 30 minutes and is revoked when the job ends.
#
# Releasing: bump `version` in openbim-mvd/Cargo.toml (and the workspace),
# date the CHANGELOG section, commit on main, then push an annotated tag
# `v<version>` on that commit. Run it by hand (Actions -> Release -> Run
# workflow) with a tag name to rehearse a release: the tagged commit is gated
# and packaged, nothing is published.
name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rehearse, e.g. v0.2.0 (gate and package only)"
        required: true

# Never cancel a release halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  gate:
    name: Plan and gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Require the tag to be on main
        # A tag on an unmerged branch would publish code main never gated.
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No dependency cache in a release build.
          node-version: '22'
      - name: Install Rust 1.85
        # The same pin as rust-toolchain.toml, so the release gate is the CI gate.
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy
      - name: Require the tag to name the crate's version
        id: plan
        run: |
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="openbim-mvd"))')"
          [ "$TAG" = "v$version" ] \
            || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run the gate on the tagged commit
        # The same gate as CI: fmt, MSRV check, build, tests, clippy, docs,
        # leakage checks, mutation probes, `cargo package` with a leakage scan
        # of the .crate, and the documentation build.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/openbim-mvd-target
        run: ./scripts/gate.sh

  publish:
    name: Publish to crates.io
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: crates.io
      url: https://crates.io/crates/openbim-mvd/${{ needs.gate.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - name: Check whether this version is already live
        # Re-running a partly failed release finishes it instead of failing
        # on what already succeeded. The first version of a new crate is
        # published by hand, so for it this step only lets the release follow.
        id: live
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'openbimrs/mvd release workflow (github.com/openbimrs/mvd)' \
            "https://crates.io/api/v1/crates/openbim-mvd/$VERSION")"
          echo "live=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        if: steps.live.outputs.live != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: steps.live.outputs.live != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p openbim-mvd --locked

  github-release:
    name: GitHub release
    needs: [gate, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python3 - > notes.md <<'EOF'
          import os, re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          start = text.index(f"## [{os.environ['VERSION']}]")
          # The section ends at the next version heading or the link references.
          end = re.compile(r"^(## \[|\[[^\]]+\]: )", re.M).search(text, text.index("\n", start))
          body = text[start:end.start() if end else len(text)]
          print(body.split("\n", 1)[1].strip())
          print(f"\n**crates.io:** https://crates.io/crates/openbim-mvd/{os.environ['VERSION']}")
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "openbim-mvd $VERSION" --notes-file notes.md --verify-tag
          fi
